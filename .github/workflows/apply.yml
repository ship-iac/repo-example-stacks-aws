name: shipmate · apply
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (empty = bare `shipmate apply`, all non-explicit environments)
        required: false
        default: ''
      ref: { description: PR head SHA to apply, required: true }
      pr_number: { description: PR number, required: true }
      plan_run_id: { description: Plan run id with the reviewed plans, required: true }
permissions:
  contents: read
  actions: read
  pull-requests: read
  id-token: write
jobs:
  targeted:
    if: ${{ inputs.environment != '' }}
    uses: ship-iac/shipmate/.github/workflows/apply.yml@5ee006bca6935e70a63b65bcd3f91f60efd7c179 # v0.8.0
    permissions: { contents: read, checks: read, actions: read, id-token: write }
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      ref: ${{ inputs.ref }}
      pr_number: ${{ inputs.pr_number }}
      plan_run_id: ${{ inputs.plan_run_id }}
      state_suffix: ""
  all:
    if: ${{ inputs.environment == '' }}
    uses: ship-iac/shipmate/.github/workflows/apply-all.yml@5ee006bca6935e70a63b65bcd3f91f60efd7c179 # v0.8.0
    permissions: { contents: read, checks: read, actions: read, id-token: write }
    secrets: inherit
    with:
      ref: ${{ inputs.ref }}
      pr_number: ${{ inputs.pr_number }}
      plan_run_id: ${{ inputs.plan_run_id }}
      state_suffix: ""
