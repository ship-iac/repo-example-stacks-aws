name: shipmate drift
on:
  schedule:
    - cron: "17 3 * * *"   # nightly, off-peak
  workflow_dispatch:
permissions: {}
jobs:
  drift:
    name: sweep
    uses: ship-iac/shipmate/.github/workflows/drift.yml@795e7cf45ea909c5e3238e3e732c7a6bdf61c9ec # v0.58.0
    permissions:
      contents: read
      id-token: write
      actions: read
    secrets:
      SHIPMATE_APP_PRIVATE_KEY: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      SHIPMATE_ENCRYPTION_KEY: ${{ secrets.SHIPMATE_ENCRYPTION_KEY }}
      SHIPMATE_SECRETS: ${{ secrets.SHIPMATE_SECRETS }}
    with:
      runs_on: ubuntu-26.04-arm
