name: shipmate drift
on:
  schedule:
    - cron: "17 3 * * *"   # nightly, off-peak
  workflow_dispatch:
permissions: {}
jobs:
  drift:
    name: shipmate
    uses: ship-iac/shipmate/.github/workflows/drift.yml@73caa27536f22d3a662f9906a8a6a426f8f7a849 # v0.47.1
    permissions:
      contents: read
      id-token: write
      actions: read
    secrets:
      SHIPMATE_APP_PRIVATE_KEY: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      SHIPMATE_PLAN_PASSPHRASE: ${{ secrets.SHIPMATE_PLAN_PASSPHRASE }}
      SHIPMATE_SECRETS: ${{ secrets.SHIPMATE_SECRETS }}
