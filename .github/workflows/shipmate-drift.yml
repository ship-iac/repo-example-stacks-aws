name: shipmate drift
on:
  schedule:
    - cron: "17 3 * * *"   # nightly, off-peak
  workflow_dispatch:
permissions: {}
jobs:
  drift:
    name: sweep
    uses: ship-iac/shipmate/.github/workflows/drift.yml@b8cb3662eb4769e9c7f9478500928f2efa91b7ba # v0.53.0
    permissions:
      contents: read
      id-token: write
      actions: read
    secrets:
      SHIPMATE_APP_PRIVATE_KEY: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      SHIPMATE_ENCRYPTION_KEY: ${{ secrets.SHIPMATE_ENCRYPTION_KEY }}
      SHIPMATE_SECRETS: ${{ secrets.SHIPMATE_SECRETS }}
    with:
      runs_on: ubuntu-26.04-arm
