name: shipmate drift
on:
  schedule:
    - cron: "17 3 * * *"   # nightly, off-peak
  workflow_dispatch:
permissions: {}
jobs:
  drift:
    name: shipmate
    uses: ship-iac/shipmate/.github/workflows/drift.yml@00fa6affdda81f77969b0db8e87bd84d2d700dbe # v0.47.0
    permissions:
      contents: read
      id-token: write
      actions: read
    secrets:
      SHIPMATE_APP_PRIVATE_KEY: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      SHIPMATE_PLAN_PASSPHRASE: ${{ secrets.SHIPMATE_PLAN_PASSPHRASE }}
      SHIPMATE_SECRETS: ${{ secrets.SHIPMATE_SECRETS }}
