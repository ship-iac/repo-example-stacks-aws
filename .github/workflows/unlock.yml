name: shipmate · unlock
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment whose stranded state locks to release
        required: false
        default: ''
      ref:
        description: PR head SHA to check out
        required: false
        default: ''
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  unlock:
    uses: ship-iac/shipmate/.github/workflows/unlock.yml@71e1aa46df8f9727fb4c2795312348328b5f5aa7 # v0.22.1
    permissions: { contents: read, checks: read, actions: read, id-token: write }
    with:
      environment: ${{ inputs.environment }}
      ref: ${{ inputs.ref }}
