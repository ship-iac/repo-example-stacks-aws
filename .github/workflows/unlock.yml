name: shipmate · unlock
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment whose stranded state locks to release
        required: false
        default: ''
      ref:
        description: PR head SHA to check out
        required: false
        default: ''
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  unlock:
    uses: ship-iac/shipmate/.github/workflows/unlock.yml@11b31b5c4980b5670fa5094bb8b50f639c564ca7 # v0.21.0
    permissions: { contents: read, checks: read, actions: read, id-token: write }
    with:
      environment: ${{ inputs.environment }}
      ref: ${{ inputs.ref }}
