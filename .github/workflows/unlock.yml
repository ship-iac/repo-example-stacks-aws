name: shipmate · unlock
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment whose stranded state locks to release
        required: false
        default: ''
      ref:
        description: PR head SHA to check out
        required: false
        default: ''
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  unlock:
    uses: ship-iac/shipmate/.github/workflows/unlock.yml@cda2a93ac43b7a0ad52efcb0c390755e5bcb3915 # v0.22.0
    permissions: { contents: read, checks: read, actions: read, id-token: write }
    with:
      environment: ${{ inputs.environment }}
      ref: ${{ inputs.ref }}
