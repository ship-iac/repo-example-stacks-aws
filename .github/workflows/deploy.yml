name: shipmate · deploy
on:
  push:
    branches: [main]
concurrency:
  group: deploy-main
  cancel-in-progress: false
permissions:
  contents: read
  pull-requests: read
  actions: read
  id-token: write
jobs:
  deploy:
    # Display only: the run's job path reads
    # `shipmate · deploy / post-merge / L<n> / apply / <stack> / <env>`.
    name: post-merge
    uses: ship-iac/shipmate/.github/workflows/deploy.yml@40347466fed3591d4382464262e4ac3ef50e0cdc # v0.11.0
    permissions: { contents: read, checks: read, pull-requests: read, actions: read, id-token: write }
    secrets: inherit
    with:
      state_suffix: ""
