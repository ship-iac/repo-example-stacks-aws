name: shipmate · deploy
on:
  push:
    branches: [main]
concurrency:
  group: deploy-main
  cancel-in-progress: false
permissions:
  contents: read
  pull-requests: read
  actions: read
  id-token: write
jobs:
  deploy:
    # Display only: the run's job path reads
    # `shipmate · deploy / post-merge / L<n> / apply / <stack> / <env>`.
    name: post-merge
    uses: ship-iac/shipmate/.github/workflows/deploy.yml@6be3d341e5d291b437fc85561de435d5f3cc8930 # v0.7.0
    permissions: { contents: read, checks: read, pull-requests: read, actions: read, id-token: write }
    secrets: inherit
    with:
      state_suffix: ""
