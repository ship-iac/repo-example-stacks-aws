name: test-approve
# Acceptance-testing helper ONLY: posts a review as github-actions[bot] so the
# comment-ops apply-path (whose authorization follows the branch ruleset's
# reviewDecision) can be exercised with a single human account. Defaults to
# APPROVE; pass event=REQUEST_CHANGES to exercise the changes-requested block.
# NOT part of the shipmate engine; do not use in real repos.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to review (acceptance testing only)
        required: true
      event:
        description: Review event — APPROVE or REQUEST_CHANGES
        required: false
        default: APPROVE
        type: choice
        options:
          - APPROVE
          - REQUEST_CHANGES
permissions:
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-slim
    steps:
      - name: Post review as github-actions[bot]
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.inputs.pr }}
          EVENT: ${{ github.event.inputs.event }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
            -f event="$EVENT" \
            -f body="Automated review ($EVENT) for acceptance testing (test-approve)."
