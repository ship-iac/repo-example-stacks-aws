name: shipmate · summary
# Runs at the default-branch ref with the engine's own definition, so a branch
# cannot alter it and it can reach the shipmate-engine environment. The plan
# workflow it follows holds no secrets at all.
on:
  workflow_run:
    workflows: ["shipmate · plan"]
    types: [completed]
permissions: {}
jobs:
  summary:
    uses: ship-iac/shipmate/.github/workflows/summary.yml@6be3d341e5d291b437fc85561de435d5f3cc8930 # v0.7.0
    # A callee's permissions are capped by this job's — the callee needs
    # pull-requests: read for its pull-request lookup.
    permissions: { actions: read, contents: read, pull-requests: read }
    secrets: inherit
