name: shipmate
run-name: >-
  shipmate · ${{ github.event_name == 'pull_request_target' && 'plan'
  || github.event_name == 'issue_comment' && 'comment'
  || github.event_name == 'push' && 'deploy'
  || inputs.verb }}
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # Only verb is required: one schema serves three verbs, and GitHub answers 422 to an
      # empty required input. The engine refuses a plan with no number, an apply with no ref.
      verb:
        description: What to run (plan, apply or unlock)
        type: choice
        options: [plan, apply, unlock]
        required: true
      environment:
        description: Target environment (apply and unlock; empty apply = every non-explicit environment)
        required: false
        default: ''
      ref:
        description: PR head SHA (apply and unlock)
        required: false
        default: ''
      pr_number:
        description: Pull request number (plan and apply)
        required: false
        default: ''
# Deny by default: each job grants its own permissions, so a job that loses its block gets none.
permissions: {}
jobs:
  # Names the plan checks `plan / <env> / <stack>` (`<caller job> / <callee job>`),
  # the names the plan comment links to.
  plan:
    name: plan
    # `github.event.inputs` reads under pull_request_target too, and the concurrency group
    # relies on it. apply and unlock use `inputs.*`, the only form that applies declared
    # defaults, so an omitted `environment` reads as ''.
    if: github.event_name == 'pull_request_target' || (github.event_name == 'workflow_dispatch' && github.event.inputs.verb == 'plan')
    concurrency:
      group: plan-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
      # A ready run waits for the run in flight instead of cancelling it.
      cancel-in-progress: ${{ github.event.action != 'ready_for_review' }}
    uses: ship-iac/shipmate/.github/workflows/plan.yml@7d46d732fd4cc94209d7599d92bbbe9dd9e2c103 # v0.51.0
    # Required: the callee is capped by these; fewer kills the run with no log.
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    secrets: &engine-secrets
      SHIPMATE_APP_PRIVATE_KEY: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
      SHIPMATE_ENCRYPTION_KEY: ${{ secrets.SHIPMATE_ENCRYPTION_KEY }}
      # Keep even without a repository secret: it passes the `<env>-plan` / `<env>-apply`
      # environment's envelope through. Delete it and nothing arrives.
      SHIPMATE_SECRETS: ${{ secrets.SHIPMATE_SECRETS }}
    # Runner for engine jobs but the nine on ubuntu-slim (docs/aws.md §Runner choice);
    # `*runner` reuses it, drift files set their own. ubuntu-latest for x64.
    with:
      runs_on: &runner ubuntu-26.04-arm
  comment-ops:
    name: comment
    # The engine drops comments on issues; this only selects the event.
    if: github.event_name == 'issue_comment'
    uses: ship-iac/shipmate/.github/workflows/comment-ops.yml@7d46d732fd4cc94209d7599d92bbbe9dd9e2c103 # v0.51.0
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
    secrets:
      SHIPMATE_APP_PRIVATE_KEY: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
    with:
      runs_on: *runner
  deploy:
    # Display only: the job path reads `shipmate / deploy / L<n> / <env> / <stack>`.
    name: deploy
    if: github.event_name == 'push'
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    uses: ship-iac/shipmate/.github/workflows/deploy.yml@7d46d732fd4cc94209d7599d92bbbe9dd9e2c103 # v0.51.0
    permissions: { contents: read, checks: read, pull-requests: read, actions: read, id-token: write }
    secrets: *engine-secrets
    with:
      runs_on: *runner
  apply:
    if: github.event_name == 'workflow_dispatch' && inputs.verb == 'apply'
    uses: ship-iac/shipmate/.github/workflows/apply.yml@7d46d732fd4cc94209d7599d92bbbe9dd9e2c103 # v0.51.0
    permissions: { contents: read, checks: read, actions: read, id-token: write }
    secrets: *engine-secrets
    with:
      environment: ${{ inputs.environment }}
      ref: ${{ inputs.ref }}
      pr_number: ${{ inputs.pr_number }}
      runs_on: *runner
  unlock:
    if: github.event_name == 'workflow_dispatch' && inputs.verb == 'unlock'
    uses: ship-iac/shipmate/.github/workflows/unlock.yml@7d46d732fd4cc94209d7599d92bbbe9dd9e2c103 # v0.51.0
    permissions: { contents: read, checks: read, actions: read, id-token: write }
    secrets:
      SHIPMATE_SECRETS: ${{ secrets.SHIPMATE_SECRETS }}
    with:
      environment: ${{ inputs.environment }}
      ref: ${{ inputs.ref }}
      runs_on: *runner
