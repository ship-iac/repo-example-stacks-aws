name: shipmate · drift
on:
  schedule:
    - cron: "17 3 * * *"   # nightly, off-peak
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shipmate:
    name: shipmate
    uses: ship-iac/shipmate/.github/workflows/drift.yml@c622ff75680fbf4def63887a759a37dded892ea2 # v0.26.0
    permissions:
      contents: read
      id-token: write
      actions: read
    secrets:
      SHIPMATE_APP_PRIVATE_KEY: ${{ secrets.SHIPMATE_APP_PRIVATE_KEY }}
    with:
      state_suffix: ""
      # Empty covers every cell. Split the sweep by adding more files, one tag query each.
      tags: ""
