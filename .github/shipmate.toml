# ACCEPTANCE FIXTURE, not a working configuration. This branch changes roles,
# ordering and exclusions at once so a plan run can demonstrate that execution
# resolves the DEFAULT branch's values and ignores this file. The dev-eu role
# below does not exist: if a cell ever assumed it, the credentials step would
# fail rather than quietly succeed.
layout = "dry"
explicit_envs = ["sbx"]

[env_order]
dev-eu = ["dev-us"]

[environments.dev-eu]
region = "eu-west-1"
aws.plan.role = "arn:aws:iam::981781037707:role/branch-must-not-be-used"
aws.apply.role = "arn:aws:iam::981781037707:role/branch-must-not-be-used"

[environments.dev-us]
region = "us-east-1"
aws.plan.role = "arn:aws:iam::981781037707:role/shipmate-plan"
aws.apply.role = "arn:aws:iam::981781037707:role/shipmate-apply"

[environments.sbx]
region = "eu-west-1"
aws.plan.role = "arn:aws:iam::981781037707:role/sbx"
aws.apply.role = "arn:aws:iam::981781037707:role/sbx-apply"
